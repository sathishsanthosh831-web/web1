<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>My Website</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    font-family: "Segoe UI", system-ui, sans-serif;
    background: linear-gradient(135deg, #1e1b4b, #312e81 50%, #0f172a);
    color: #e2e8f0;
    padding: 30px 16px 60px;
  }
  .wrap { max-width: 520px; margin: 0 auto; }
  .card {
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 20px; padding: 28px 24px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.4);
    margin-bottom: 20px;
  }
  h1 {
    font-size: 1.7rem; text-align: center; margin-bottom: 6px;
    background: linear-gradient(90deg, #a5b4fc, #f0abfc);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  h2 { font-size: 1.2rem; margin-bottom: 10px; }
  .sub { color: #94a3b8; font-size: 0.92rem; text-align: center; margin-bottom: 22px; }
  .hidden { display: none !important; }
  label { display: block; font-size: 0.85rem; color: #cbd5e1; margin-bottom: 6px; }
  input {
    width: 100%; padding: 12px 14px; margin-bottom: 14px;
    border-radius: 12px; border: 1px solid rgba(255,255,255,0.15);
    background: rgba(15,23,42,0.6); color: #f1f5f9; font-size: 0.97rem; outline: none;
  }
  input:focus { border-color: #818cf8; box-shadow: 0 0 0 3px rgba(129,140,248,0.25); }
  .btn {
    display: flex; align-items: center; justify-content: center;
    width: 100%; padding: 13px; border: none; border-radius: 12px;
    font-size: 1rem; font-weight: 600; color: #fff; cursor: pointer; text-decoration: none;
    background: linear-gradient(90deg, #14b8a6, #6366f1);
    transition: transform 0.15s, opacity 0.2s;
  }
  .btn:hover { transform: translateY(-2px); opacity: 0.92; }
  .btn.ghost {
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.15);
  }
  .btn.small { width: auto; padding: 8px 14px; font-size: 0.85rem; }
  .links { display: flex; flex-direction: column; gap: 12px; }
  .status { color: #94a3b8; text-align: center; padding: 14px; font-size: 0.92rem; }
  .error { color: #fca5a5; font-size: 0.87rem; min-height: 1.2em; margin-bottom: 8px; }
  .top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
  .item {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    background: rgba(15,23,42,0.5); border: 1px solid rgba(255,255,255,0.1);
    border-radius: 12px; padding: 10px 12px;
  }
  .item-text { overflow: hidden; min-width: 0; }
  .item-name { font-weight: 600; }
  .item-link {
    font-size: 0.8rem; color: #94a3b8;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .del {
    background: rgba(239,68,68,0.15); color: #fca5a5;
    border: 1px solid rgba(239,68,68,0.3);
    border-radius: 8px; padding: 6px 10px; cursor: pointer; flex-shrink: 0;
  }
  .warn {
    margin-top: 20px; font-size: 0.8rem; color: #fde68a; text-align: center;
  }
  .modal {
    position: fixed; inset: 0; background: rgba(0,0,0,0.6);
    display: flex; align-items: center; justify-content: center; padding: 16px;
  }
  .modal-box {
    width: 100%; max-width: 360px;
    background: #1e1b4b; border: 1px solid rgba(255,255,255,0.15);
    border-radius: 18px; padding: 26px 22px;
  }
</style>
</head>
<body>

<div class="wrap">

  <!-- HOME SCREEN (public) -->
  <div class="card" id="homeCard">
    <h1>My Links</h1>
    <p class="sub">Keela irukkura button-la click panni link open pannunga.</p>
    <div class="links" id="links">
      <div class="status">Loading...</div>
    </div>
  </div>

  <!-- LOCK BOX BUTTON -->
  <div class="card" id="lockCard">
    <button class="btn ghost" id="openLockBtn">🔒 Links Add Pannanum</button>
  </div>

  <!-- ADMIN PANEL (after password) -->
  <div class="card hidden" id="adminCard">
    <div class="top">
      <h2>Link Manager</h2>
      <button class="btn ghost small" id="closeAdminBtn">Close</button>
    </div>

    <label for="nameInput">Name</label>
    <input id="nameInput" type="text" placeholder="Eg: YouTube" maxlength="40" />

    <label for="linkInput">Link</label>
    <input id="linkInput" type="url" placeholder="https://youtube.com" />

    <div class="error" id="addError"></div>
    <button class="btn" id="addBtn">+ Add</button>

    <div style="margin-top:20px;" id="adminList"></div>
  </div>

  <div class="warn">⚠️ Therinja link-a mattum open pannunga.</div>
</div>

<!-- PASSWORD MODAL -->
<div class="modal hidden" id="lockModal">
  <div class="modal-box">
    <h2 style="text-align:center;">🔒 Password</h2>
    <p class="sub" style="margin-bottom:14px;">Password type pannunga</p>
    <input id="passInput" type="password" placeholder="Password" />
    <div class="error" id="lockError"></div>
    <button class="btn" id="unlockBtn">Unlock</button>
    <button class="btn ghost" id="cancelLockBtn" style="margin-top:10px;">Cancel</button>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import {
    getFirestore, collection, addDoc, getDocs, deleteDoc, doc, query, orderBy, serverTimestamp
  } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  // ---- Firebase config (webs project) ----
  const firebaseConfig = {
    apiKey: "AIzaSyAbRqPNnEyuz3A6BotGxkzOltETLKrSfJc",
    authDomain: "webs-93c46.firebaseapp.com",
    projectId: "webs-93c46",
    storageBucket: "webs-93c46.firebasestorage.app",
    messagingSenderId: "838265859523",
    appId: "1:838265859523:web:2b7922c8e4a3ba58dda176"
  };

  const ADMIN_PASSWORD = "2311";
  const COLLECTION = "links";

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const linksRef = collection(db, COLLECTION);

  const $ = (id) => document.getElementById(id);

  function cleanUrl(value) {
    try {
      const u = new URL(value.trim());
      return (u.protocol === "http:" || u.protocol === "https:") ? u.href : null;
    } catch { return null; }
  }

  async function loadLinks() {
    try {
      const q = query(linksRef, orderBy("createdAt", "asc"));
      const snap = await getDocs(q);
      return snap.docs.map(d => ({ id: d.id, ...d.data() }));
    } catch (err) {
      console.error(err);
      return null;
    }
  }

  // ---------- HOME: public buttons ----------
  async function renderHome() {
    const box = $("links");
    box.innerHTML = '<div class="status">Loading...</div>';
    const items = await loadLinks();

    if (items === null) {
      box.innerHTML = '<div class="status">Links load aagala. Konjam neram kazhichu try pannunga.</div>';
      return;
    }
    if (items.length === 0) {
      box.innerHTML = '<div class="status">Innum links illai.</div>';
      return;
    }

    box.innerHTML = "";
    items.forEach((item) => {
      const url = cleanUrl(item.link || "");
      if (!url) return;
      const a = document.createElement("a");
      a.className = "btn";
      a.href = url;
      a.target = "_blank";
      a.rel = "noopener noreferrer";
      a.textContent = item.name || url;
      box.appendChild(a);
    });
  }

  // ---------- LOCK / ADMIN ----------
  $("openLockBtn").addEventListener("click", () => {
    $("lockModal").classList.remove("hidden");
    $("passInput").value = "";
    $("lockError").textContent = "";
    setTimeout(() => $("passInput").focus(), 50);
  });

  $("cancelLockBtn").addEventListener("click", () => {
    $("lockModal").classList.add("hidden");
  });

  function tryUnlock() {
    if ($("passInput").value === ADMIN_PASSWORD) {
      $("lockModal").classList.add("hidden");
      $("adminCard").classList.remove("hidden");
      $("lockCard").classList.add("hidden");
      renderAdmin();
      $("adminCard").scrollIntoView({ behavior: "smooth" });
    } else {
      $("lockError").textContent = "Password thappu.";
    }
  }

  $("unlockBtn").addEventListener("click", tryUnlock);
  $("passInput").addEventListener("keydown", (e) => { if (e.key === "Enter") tryUnlock(); });

  $("closeAdminBtn").addEventListener("click", () => {
    $("adminCard").classList.add("hidden");
    $("lockCard").classList.remove("hidden");
  });

  async function renderAdmin() {
    const box = $("adminList");
    box.innerHTML = '<div class="status">Loading...</div>';
    const items = await loadLinks();

    if (items === null) {
      box.innerHTML = '<div class="status">Load aagala.</div>';
      return;
    }

    box.innerHTML = "";
    const count = document.createElement("div");
    count.style.cssText = "color:#a5b4fc;font-size:0.9rem;margin-bottom:10px;";
    count.textContent = "Total links: " + items.length;
    box.appendChild(count);

    if (items.length === 0) {
      const e = document.createElement("div");
      e.className = "status";
      e.textContent = "Innum links add pannala.";
      box.appendChild(e);
      return;
    }

    const list = document.createElement("div");
    list.className = "links";

    items.forEach((item, i) => {
      const row = document.createElement("div");
      row.className = "item";

      const text = document.createElement("div");
      text.className = "item-text";
      const n = document.createElement("div");
      n.className = "item-name";
      n.textContent = (i + 1) + ". " + item.name;
      const l = document.createElement("div");
      l.className = "item-link";
      l.textContent = item.link;
      text.append(n, l);

      const del = document.createElement("button");
      del.className = "del";
      del.textContent = "Delete";
      del.onclick = async () => {
        if (!confirm("'" + item.name + "' delete pannalaama?")) return;
        try {
          await deleteDoc(doc(db, COLLECTION, item.id));
          renderAdmin();
          renderHome();
        } catch (err) {
          alert("Delete aagala: " + err.message);
        }
      };

      row.append(text, del);
      list.appendChild(row);
    });

    box.appendChild(list);
  }

  $("addBtn").addEventListener("click", async () => {
    const name = $("nameInput").value.trim();
    const link = cleanUrl($("linkInput").value);
    const error = $("addError");
    error.textContent = "";

    if (!name) { error.textContent = "Name type pannunga."; return; }
    if (!link) { error.textContent = "Sariyana link (https:// la start aaganum)."; return; }

    $("addBtn").disabled = true;
    try {
      await addDoc(linksRef, { name, link, createdAt: serverTimestamp() });
      $("nameInput").value = "";
      $("linkInput").value = "";
      $("nameInput").focus();
      renderAdmin();
      renderHome();
    } catch (err) {
      error.textContent = "Save aagala: " + err.message;
    } finally {
      $("addBtn").disabled = false;
    }
  });

  // Start
  renderHome();
</script>

</body>
</html>
