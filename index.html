<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>web1 - Link Admin</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    font-family: "Segoe UI", system-ui, sans-serif;
    background: linear-gradient(135deg, #1e1b4b, #312e81 50%, #0f172a);
    color: #e2e8f0;
    display: flex; justify-content: center;
    padding: 30px 16px;
  }
  .card {
    width: 100%; max-width: 520px;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 20px; padding: 30px 26px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.4);
  }
  h1 {
    font-size: 1.5rem; margin-bottom: 6px;
    background: linear-gradient(90deg, #a5b4fc, #f0abfc);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .sub { color: #94a3b8; font-size: 0.9rem; margin-bottom: 20px; }
  label { display: block; font-size: 0.85rem; color: #cbd5e1; margin-bottom: 6px; }
  input {
    width: 100%; padding: 12px 14px; margin-bottom: 14px;
    border-radius: 12px; border: 1px solid rgba(255,255,255,0.15);
    background: rgba(15,23,42,0.6); color: #f1f5f9; font-size: 0.97rem; outline: none;
  }
  input:focus { border-color: #818cf8; box-shadow: 0 0 0 3px rgba(129,140,248,0.25); }
  .btn {
    width: 100%; padding: 12px; border: none; border-radius: 12px;
    font-size: 0.98rem; font-weight: 600; color: #fff; cursor: pointer;
    background: linear-gradient(90deg, #6366f1, #a855f7);
    transition: transform 0.15s, opacity 0.2s;
  }
  .btn:hover { transform: translateY(-2px); opacity: 0.92; }
  .btn.secondary { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.15); margin-top: 10px; }
  .error { color: #fca5a5; font-size: 0.87rem; min-height: 1.2em; margin-bottom: 8px; }
  .list { margin-top: 22px; display: flex; flex-direction: column; gap: 10px; }
  .item {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    background: rgba(15,23,42,0.5); border: 1px solid rgba(255,255,255,0.1);
    border-radius: 12px; padding: 10px 12px;
  }
  .item-text { overflow: hidden; }
  .item-name { font-weight: 600; }
  .item-link { font-size: 0.8rem; color: #94a3b8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .del {
    background: rgba(239,68,68,0.15); color: #fca5a5; border: 1px solid rgba(239,68,68,0.3);
    border-radius: 8px; padding: 6px 10px; cursor: pointer; flex-shrink: 0;
  }
  .output {
    margin-top: 20px; display: none; background: rgba(15,23,42,0.7);
    border-radius: 12px; padding: 12px; font-family: Consolas, monospace;
    font-size: 0.8rem; white-space: pre-wrap; word-break: break-all; color: #bbf7d0;
  }
  .output.show { display: block; }
  .help { margin-top: 14px; font-size: 0.82rem; color: #fde68a; }
  .empty { color: #64748b; font-size: 0.9rem; text-align: center; padding: 10px; }
</style>
</head>
<body>

<div class="card">
  <h1>Link Admin (web1)</h1>
  <p class="sub">Name-um link-um add pannunga. Ellaathaiyum oru JSON-ah copy panni GitHub-la paste pannunga.</p>

  <label for="nameInput">Name</label>
  <input id="nameInput" type="text" placeholder="Eg: YouTube" maxlength="40" />

  <label for="linkInput">Link</label>
  <input id="linkInput" type="url" placeholder="https://youtube.com" />

  <div class="error" id="errorMsg"></div>
  <button class="btn" id="addBtn">+ Add</button>

  <div class="list" id="list"></div>

  <button class="btn secondary" id="genBtn">Generate JSON</button>
  <div class="output" id="output"></div>
  <button class="btn secondary" id="copyBtn" style="display:none;">Copy JSON</button>

  <p class="help">
    Steps: Generate JSON → Copy → web1 repo-la <b>links.json</b> file-la paste pannunga → Commit changes.
  </p>
</div>

<script>
  const $ = (id) => document.getElementById(id);
  const KEY = "web1-links";
  let items = JSON.parse(localStorage.getItem(KEY) || "[]");

  function save() { localStorage.setItem(KEY, JSON.stringify(items)); }

  function cleanUrl(value) {
    try {
      const u = new URL(value.trim());
      return (u.protocol === "http:" || u.protocol === "https:") ? u.href : null;
    } catch { return null; }
  }

  function render() {
    const list = $("list");
    list.innerHTML = "";
    if (items.length === 0) {
      const e = document.createElement("div");
      e.className = "empty";
      e.textContent = "Innum links add pannala.";
      list.appendChild(e);
      return;
    }
    items.forEach((item, i) => {
      const row = document.createElement("div");
      row.className = "item";

      const text = document.createElement("div");
      text.className = "item-text";
      const n = document.createElement("div");
      n.className = "item-name";
      n.textContent = item.name;
      const l = document.createElement("div");
      l.className = "item-link";
      l.textContent = item.link;
      text.append(n, l);

      const del = document.createElement("button");
      del.className = "del";
      del.textContent = "Delete";
      del.onclick = () => { items.splice(i, 1); save(); render(); };

      row.append(text, del);
      list.appendChild(row);
    });
  }

  $("addBtn").addEventListener("click", () => {
    const name = $("nameInput").value.trim();
    const link = cleanUrl($("linkInput").value);
    const error = $("errorMsg");
    error.textContent = "";

    if (!name) { error.textContent = "Name type pannunga."; return; }
    if (!link) { error.textContent = "Sariyana link (https:// la start aaganum)."; return; }

    items.push({ name, link });
    save();
    render();
    $("nameInput").value = "";
    $("linkInput").value = "";
    $("output").classList.remove("show");
    $("copyBtn").style.display = "none";
  });

  $("genBtn").addEventListener("click", () => {
    const out = $("output");
    out.textContent = JSON.stringify(items, null, 2);
    out.classList.add("show");
    $("copyBtn").style.display = "block";
  });

  $("copyBtn").addEventListener("click", async () => {
    try {
      await navigator.clipboard.writeText($("output").textContent);
      $("copyBtn").textContent = "Copied! ✓";
    } catch {
      $("copyBtn").textContent = "Copy failed";
    }
    setTimeout(() => ($("copyBtn").textContent = "Copy JSON"), 1500);
  });

  render();
</script>

</body>
</html>
